[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kukkiri"
version = "0.1.0"
description = "Restore mosaic-censored video"
readme = "README.md"
license = "GPL-3.0-only AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md", "NOTICE.md", "licenses/*"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "rfdetr>=1.10",
    "PyNvVideoCodec>=2.0",
    "tensorrt>=10",
    "torch-tensorrt>=2.8",
    "onnx>=1.16",
    "onnxconverter-common>=1.14",
    "safetensors>=0.4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8"]

[project.scripts]
kukkiri = "kukkiri.cli:main"

[project.gui-scripts]
kukkiri-gui = "kukkiri.gui:main"

[tool.setuptools]
packages = ["kukkiri"]

[tool.setuptools.package-data]
kukkiri = ["icon.png", "watermark.png"]
