[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kukkiri"
version = "0.0.0.dev0"
description = "Restore mosaic-censored video, or add mosaics"
readme = "README.md"
license = "GPL-3.0-only AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md", "NOTICE.md", "licenses/*"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "torchvision>=0.29; sys_platform == 'darwin'",  # deformable convolution on the Apple GPU
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "rfdetr>=1.10",
    "PyNvVideoCodec>=2.0; sys_platform != 'darwin'",
    "tensorrt>=10; sys_platform != 'darwin'",
    "torch-tensorrt>=2.8; sys_platform != 'darwin'",
    "onnx>=1.16; sys_platform != 'darwin'",
    "onnxconverter-common>=1.14; sys_platform != 'darwin'",
    "safetensors>=0.4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8", "nvidia-ml-py>=12", "psutil>=5"]  # nvidia-ml-py + psutil: the usage meters
ltx = [
    "transformers==5.17.0", "accelerate==1.15.0", "einops==0.8.2", "scipy==1.18.1", "colour-science==0.4.7",
    "av==18.1.0", "OpenImageIO==3.2.2.0", "pillow>=11", "tqdm>=4.66",
]  # plus torchaudio with --no-deps (2.11 declares torch==2.11, imports fine on 2.14)

[project.scripts]
kukkiri = "kukkiri.cli:main"

[project.gui-scripts]
kukkiri-gui = "kukkiri.gui:main"

[tool.setuptools]
packages = ["kukkiri"]

[tool.setuptools.package-data]
kukkiri = ["icon.png", "watermark.png"]
